services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex"]
      interval: 2s
      retries: 20

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app/backend
    command: sh -c "uv sync --frozen && uv run alembic upgrade head && uv run python -m app.seed && uv run uvicorn app.main:app --host 0.0.0.0 --reload"
    environment:
      DATABASE_URL: postgresql://apex:apex@db:5432/apex
      UV_PROJECT_ENVIRONMENT: /venv
    env_file: [{ path: .env, required: false }]
    volumes: [".:/app", "venv:/venv"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "yarn install --frozen-lockfile && yarn dev --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes: [".:/app", "node_modules:/app/frontend/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  venv:
  node_modules:
