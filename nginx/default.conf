server {
    listen 80;
    server_name apexprep.duckdns.org;
    return 301 https://$host$request_uri;
}
server { 
    listen 443 ssl;
    server_name apexprep.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/apexprep.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexprep.duckdns.org/privkey.pem;

    location / {
    proxy_pass http://app:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }
}
