name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: apex, POSTGRES_PASSWORD: apex, POSTGRES_DB: apex }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U apex" --health-interval 2s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql://apex:apex@localhost:5432/apex
      TEST_DATABASE_URL: postgresql://apex:apex@localhost:5432/apex_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
